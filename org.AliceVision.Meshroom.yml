app-id: org.AliceVision.Meshroom
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: "6.8"
base: io.qt.PySide.BaseApp
base-version: "6.8"
command: meshroom
finish-args:
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=/media
  - --device=all
cleanup:
modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST}
      - ./b2 install --prefix=${FLATPAK_DEST} link=shared runtime-link=shared cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    cleanup:
      - "*"
    sources:
      - type: archive
        url: https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-cmake.tar.gz
        sha256: f51707c27359a0df0cac1beada86de31bb5eed5e8285592dadec384df99c2984
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: ttps://github.com/boostorg/boost/releases/download/boost-$version/boost-${major}.${minor}.${patch}-cmake.tar.gz
  - name: Imath
    buildsystem: cmake-ninja
    config-opts:
      - -DPYTHON:BOOL=ON
    sources:
      - type: archive
        url: https://github.com/AcademySoftwareFoundation/Imath/releases/download/v3.2.3/Imath-3.2.3.tar.gz
        sha256: 72f498e7073890a2a1b870e453908a07c9725f9d1384527043a38578bfb4ef31
        x-checker-data:
          type: anitya
          project-id: 223366
          stable-only: true
          url-template: https://github.com/AcademySoftwareFoundation/Imath/archive/v$version/imath-$version.tar.gz
  - "meshroom-python.json"
  - name: meshroom
    buildsystem: simple
    no-python-timestamp-fix: true
    build-commands:
      - install meshroom.sh ${FLATPAK_DEST}/bin/meshroom
      - cp -a meshroom ${FLATPAK_DEST}/
    sources:
      - type: git
        url: https://github.com/alicevision/meshroom.git
        commit: 5e5185e02c0e5294dfb2f519f4dbd1dfb2f855f3
        tag: nightly
      - type: script
        dest-filename: meshroom.sh
        commands:
          - export PYTHONPATH=/app:${PYTHONPATH}
          - exec python3 -m meshroom.ui "$@"
